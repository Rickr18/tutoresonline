<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#12233f" />
    <link rel="icon" type="image/svg+xml" href="/icono.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iPhone: "Agregar a pantalla de inicio" en Safari la abre como app a pantalla completa -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TutoresOn" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>TutoresOn-Line</title>
    <script>
      // iPhone: la app de estudiante y tutor está en /app/ (la misma app móvil, exportada a web).
      // ?web=1 deja la versión web completa (soporte y administración) y lo recuerda; las páginas públicas de información no se redirigen.
      (function () {
        try {
          var clave = 'tutoresonline.version-web';
          if (/[?&]web=1(&|$)/.test(location.search)) localStorage.setItem(clave, '1');
          var iphone = /iPhone|iPod/.test(navigator.userAgent);
          var ruta = location.pathname;
          // Si la PWA no está compilada, /app/ cae en esta misma página: no se vuelve a redirigir.
          if (iphone && localStorage.getItem(clave) !== '1' && !/^\/(descargar|terminos|privacidad|ayuda|app)/.test(ruta)) location.replace('/app/');
        } catch (e) { /* sin almacenamiento: se queda en la web */ }
      })();
    </script>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
