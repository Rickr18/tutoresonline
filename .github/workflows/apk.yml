# Compila el APK de Android de la app móvil y lo publica como release del repositorio.
# Se ejecuta a mano (Actions > "APK Android" > Run workflow) o al subir una etiqueta v*.
# El APK usa por defecto el servidor de Render de mobile/app.json (expo.extra.servidor).
# Opcional: la variable del repositorio API_URL (Settings > Secrets and variables > Actions > Variables) lo reemplaza.
# La versión (versionName) y el versionCode salen de mobile/app.json; súbelos antes de cada APK nuevo.

name: APK Android

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.API_URL }}
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar tipos
        run: npx tsc --noEmit

      - name: Versión y servidor del APK
        id: datos
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          CODIGO=$(node -p "require('./app.json').expo.android.versionCode")
          SERVIDOR="${EXPO_PUBLIC_API_URL:-$(node -p "require('./app.json').expo.extra.servidor")}"
          echo "Versión $VERSION, versionCode $CODIGO, servidor $SERVIDOR"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "versionCode=$CODIGO" >> "$GITHUB_OUTPUT"
          echo "servidor=$SERVIDOR" >> "$GITHUB_OUTPUT"

      # --clean regenera android/ desde cero con el código de este commit (nada de compilaciones anteriores).
      - name: Generar el proyecto nativo
        run: npx expo prebuild --platform android --no-install --clean

      - name: Compilar APK (release)
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Renombrar
        run: cp android/app/build/outputs/apk/release/app-release.apk TutoresOn-Line.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TutoresOn-Line-apk
          path: mobile/TutoresOn-Line.apk

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('apk-{0}-{1}', steps.datos.outputs.version, github.run_number) }}
          name: TutoresOn-Line ${{ steps.datos.outputs.version }} (versionCode ${{ steps.datos.outputs.versionCode }})
          body: |
            APK de la app móvil de TutoresOn-Line ${{ steps.datos.outputs.version }} (versionCode ${{ steps.datos.outputs.versionCode }}), commit ${{ github.sha }}.
            Servidor por defecto: ${{ steps.datos.outputs.servidor }}
            Instalación: descargar TutoresOn-Line.apk en el teléfono y permitir la instalación de apps de origen desconocido.
          files: mobile/TutoresOn-Line.apk
